global:
  scrape_interval: 5s

# Prometheus runs in Docker; Order Service and Payment Service run on the host machine via
# mvnw, not in a container - so we reach them through Docker Desktop's host.docker.internal.
scrape_configs:
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082"]

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
