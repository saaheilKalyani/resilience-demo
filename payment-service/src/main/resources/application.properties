spring.application.name=payment-service
server.port=8081

# Actuator endpoints for this POC's observability lesson: health checks, browsing raw metric
# names/values, and the Prometheus-formatted metrics page that Prometheus scrapes.
management.endpoints.web.exposure.include=health,metrics,prometheus

# Log level for our own code. INFO is Spring Boot's default; set explicitly here
# so it's easy to find and bump to DEBUG later while learning/debugging.
logging.level.com.resilience.demo.payment=INFO
