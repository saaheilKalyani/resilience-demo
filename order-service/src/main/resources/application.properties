spring.application.name=order-service
server.port=8082

# Base URL of the downstream Payment Service. Order Service calls this over plain HTTP.
payment.service.url=http://localhost:8081

# Keep Actuator minimal for now - we only need a basic health check.
# We will expand this later when we learn observability/metrics.
management.endpoints.web.exposure.include=health

# Log level for our own code. INFO is Spring Boot's default; set explicitly here
# so it's easy to find and bump to DEBUG later while learning/debugging.
logging.level.com.resilience.demo.order=INFO

# paymentRetry: retry a failed Payment Service call up to this many times in total
# (3 = 1 initial attempt + 2 retries), waiting this long between attempts.
payment.retry.max-attempts=3
payment.retry.wait-duration-ms=500

# paymentTimeout: give Payment Service this long to respond before Order Service gives up
# and falls back. Kept well below the /payments/slow endpoint's ~5s delay on purpose.
payment.timeout.duration-ms=2000

# paymentCircuitBreaker: opens once at least 5 calls have happened and 50% or more of the
# last 5 calls failed. Small numbers on purpose so OPEN is easy to trigger from the UI -
# a couple of FAILURE clicks is enough. After 5s in OPEN it moves to HALF_OPEN on its own
# and allows 2 test calls through to decide whether to go back to CLOSED or OPEN.
payment.circuit-breaker.sliding-window-size=5
payment.circuit-breaker.minimum-number-of-calls=5
payment.circuit-breaker.failure-rate-threshold=50
payment.circuit-breaker.wait-duration-in-open-state-ms=5000
payment.circuit-breaker.permitted-calls-in-half-open=2
